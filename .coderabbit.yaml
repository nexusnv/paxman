# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: en

early_access: true

reviews:
  request_changes_workflow: true
  collapse_walkthrough: false
  labeling_instructions:
    - label: Python Lang
      instructions: Apply when the PR/MR contains changes to python source-code (src/paxman/**/*.py, tests/**/*.py).
    - label: Documentation
      instructions: Apply whenever project documentation (README.md, MANDATE.md, PROPOSED_STRUCTURE.md, RETRACTION.md, or any markdown under docs/) is updated by the PR/MR.
    - label: Spec
      instructions: Apply when the PR/MR modifies or adds a design specification under `docs/superpowers/specs/`.
    - label: Implementation Plan
      instructions: Apply when the PR/MR modifies or adds an implementation plan under `docs/superpowers/plans/`.
    - label: Mandate
      instructions: Apply when the PR/MR modifies MANDATE.md, the constitutional boundary of Paxman (the 13 laws). Any change to MANDATE.md is a constitutional amendment and must be reviewed against every other law.
    - label: Public API
      instructions: Apply when the PR/MR adds, renames, or removes symbols exported from the `paxman` package. The v2 public API is `paxman.canonicalize`, `paxman.replay`, and `paxman.register_capability` (plus the value-type re-exports). New public symbols require a design spec under `docs/superpowers/specs/` and an implementation plan under `docs/superpowers/plans/` (one of each per change).
    - label: Canonicalization
      instructions: Apply when the PR/MR touches `src/paxman/_core/orchestrator.py`, `src/paxman/_core/artifact.py`, `src/paxman/_core/replay.py`, `src/paxman/_core/types.py`, `src/paxman/_core/classification.py`, `src/paxman/_core/validation.py`, `src/paxman/_orchestrator_runtime.py`, or `src/paxman/__init__.py` in any way that could affect canonicalization, determinism, or replay.
    - label: Capability SPI
      instructions: Apply when the PR/MR touches `src/paxman/_capabilities/protocol.py`, `_capabilities/registry.py`, or any built-in capability under `_capabilities/builtins/`. The Capability Protocol is the only extension point of Paxman (mandate §5.1, Law 6, Law 11). New capabilities must be pure functions of (value, contract) — no I/O, no time, no randomness, no network.
    - label: Contract
      instructions: Apply when the PR/MR touches `src/paxman/_contracts/contract.py` or the Dict DSL. The contract declares *what* the canonical form is, never *how* it is produced (mandate Law 5). Adding a new contract `kind` requires a design spec and an implementation plan.
    - label: Replay / Determinism
      instructions: Apply when the PR/MR touches replay, artifact serialization, hash computation, the orchestrator, the registry, or any capability in any way that could affect determinism or replay byte-equality. The replay invariant (mandate Law 12) is `replay(artifact, contract) == artifact` byte-for-byte, and the determinism invariant (mandate Law 1) requires the same `(input, contract, capabilities, configuration, version)` to always produce the same artifact.
  path_filters:
    - "!*.xc*/**"
    - "!node_modules/**"
    - "!dist/**"
    - "!build/**"
    - "!.git/**"
    - "!venv/**"
    - "!.venv/**"
    - "!__pycache__/**"
    - "!.mypy_cache/**"
    - "!.ruff_cache/**"
    - "!.hypothesis/**"
    - "!.codegraph/**"
    - "!.worktrees/**"
    - "!.sisyphus/**"
    - "!uv.lock"
  path_instructions:
    - path: MANDATE.md
      instructions: >-
        When reviewing MANDATE.md:

        1. MANDATE.md is the constitutional boundary of Paxman (the 13 laws in §7 plus the three invariants in §1.2 and the
        formal canonicalization definition in §2). Every architectural decision, every pull request, and every new
        abstraction is evaluated against it. Where MANDATE.md conflicts with README.md, PROPOSED_STRUCTURE.md, a design
        spec, an implementation plan, or any other document, MANDATE.md wins.

        2. MANDATE.md is amendable, not appendable. Adding a new law is an amendment to §7. A new amendment must (a) be
        compatible with every existing law and invariant, and (b) carry an explicit "Provenance" entry in §11 noting
        when and why it was added. Flag any edit that silently weakens a law or removes it without an amendment.

        3. Laws 1–13 are the floor, not the ceiling. Do not suggest weakening a law to accommodate a PR — the law
        wins.

        4. The retired vocabulary list in §6.3 (`heuristic`, `confidence`, `best match`, `probably`, `approximate`) and
        the adopted vocabulary (`resolver`, `dispatcher`, `registry`, `matcher`, `capability resolution`) is
        normative. Edits to MANDATE.md that change the vocabulary are constitutional amendments and must carry
        the §11 provenance note.

        5. The closing sentence in §10.4 ("Paxman would rather reject a value than silently canonicalize it
        incorrectly") is the contributor principle. It is the single sentence every contributor sees before writing
        code. Do not weaken it.
    - path: PROPOSED_STRUCTURE.md
      instructions: >-
        When reviewing PROPOSED_STRUCTURE.md:

        1. PROPOSED_STRUCTURE.md is the proposed folder shape for the v2 code. It is not authoritative on its own —
        MANDATE.md wins where the two conflict.

        2. The 12-file layout under `src/paxman/` is the canonical v1.0.0 layout: `__init__.py`, `_core/{types, artifact,
        classification, validation, orchestrator, replay}.py`, `_capabilities/{protocol, registry}.py`, `_capabilities/
        builtins/__init__.py`, `_contracts/{__init__.py, contract.py}`, `_errors.py`. Adding new top-level
        sub-packages or new files outside this layout must be justified against MANDATE.md §1.2 (the three
        invariants) and the "Decisions left to make" section.

        3. The "What is gone, and why" table is normative. The v1.x subsystems (planner/, executor/, reconciler/,
        artifact/ as a subsystem, capabilities/v1/, providers/, budget.py, policy.py, the 4 contract adapters, the
        5 V1 capabilities, examples/, playground/, scripts/, docs/adr/, docs/concepts/, docs/reference/,
        docs/howto/, docs/contributing/, the Makefile, and the CI workflows) are intentionally absent. Flag any
        PR that proposes resurrecting any of them without a constitutional amendment.

        4. The four property tests named in the test plan (replay invariant, idempotence invariant, uniqueness
        invariant, immutability invariant) and the canonicalization invariant test (replay_hash matches
        sha256(canonical_bytes())) are the mechanical evidence for the three invariants in MANDATE.md §1.2.
        Edits that drop or weaken any of these tests must be flagged.
    - path: "**/*.py"
      instructions: >-
        When reviewing Python code for Paxman v2 (a deterministic canonicalization engine):

        1. Constitutional authority: MANDATE.md is the source of truth for every design decision in this file.
        Every code review must answer: which of the 13 laws (MANDATE.md §7) does this change uphold, and does it
        violate any? Flag any change that is silent on which laws it touches.

        2. Capability purity (mandate Law 8a): a capability may only depend on inputs that are explicitly
        versioned and participate in replay. No `import requests`, no `import urllib`, no `open(`, no `os.`, no
        `time.`, no `random.`, no `secrets.`, no `datetime.`, no network calls, no filesystem reads, no
        environment lookups inside `src/paxman/_capabilities/`. Pure functions of `(value, contract)` only.
        Flag any of these.

        3. Vocabulary (mandate §6.3): the words `heuristic`, `confidence`, `best match`, `probably`, and
        `approximate` are RETIRED. Their adopted replacements are `resolver`, `dispatcher`, `registry`, `matcher`,
        `capability resolution`, `matching rule`. Flag any use of the retired words in code, comments, or
        docstrings — including in test files, which must demonstrate the new vocabulary.

        4. API naming: the public API is `paxman.canonicalize`, `paxman.replay`, `paxman.register_capability`. The
        v1.x API name `paxman.normalize` is GONE. Flag any `def normalize` or `paxman.normalize` reference in
        `src/paxman/` or `tests/`. Likewise, the v1.x submodules `paxman.api`, `paxman.testing`, `paxman.contract`,
        `paxman.planner`, `paxman.executor`, `paxman.reconciler`, `paxman.artifact`, `paxman.providers` are GONE —
        flag any import from them.

        5. Status, not confidence: outcomes are the five-value `Status` enum (`CANONICALIZED`, `INVALID`,
        `MISSING`, `AMBIGUOUS`, `UNSUPPORTED`). Confidence scores, probability bands, "best match", and ranking
        are forbidden (mandate Law 3). Flag any float, band, or score on an artifact or capability result.

        6. Immutability (mandate Law 13): `ExecutionArtifact` is `@attrs.frozen`. Every field on every artifact
        is set at construction and cannot be reassigned. Flag any `artifact.<field> = ...` or any code that
        builds an artifact via a non-frozen class.

        7. Replay (mandate Law 12): `replay(artifact, contract) == artifact` byte-for-byte. The `replay_hash`
        must be independently re-computed from the artifact's canonical bytes at verification time, not
        re-read from the stored value. Flag any `_compute_replay_hash(artifact)` that returns
        `artifact.replay_hash` directly.

        8. Idempotence (mandate Law 2): `canonicalize(canonicalize(x), contract) == canonicalize(x, contract)`.
        Capability implementations must be fixed points of themselves (e.g. lower-casing is a fixed point of
        lower-casing).

        9. Contract = what, not how (mandate Law 5): contract fields are policy declarations
        (`lowercase=True/False`, `provider_aliases="none"/"gmail"`, etc.). Flag any contract field that
        describes an algorithm (e.g. `auto_detect`, `infer_provider`, `use_llm`).

        10. Data classes: use `attrs` (`@attrs.frozen` for value types, `@attrs.define` for mutable internal
        state if any). The only attrs use in v1.0.0 is for value types; paxman v2 has no pydantic dependency.
        Flag any pydantic import in `src/paxman/`.

        11. Errors: exceptions are reserved for calls that *cannot proceed* (broken contract, version
        mismatch, frozen registry, internal invariant violation). The five `Status` values are *outcomes* on a
        successfully-returned artifact, not exceptions. Flag any place that raises for a recoverable
        canonicalization outcome (an `Invalid` input is a Status, not a raise).

        12. No `as any` / `# type: ignore` / `# noqa` for type-error suppression. Use the typed alternative
        (a `Protocol`, a `TypeAlias`, a real annotation).
    - path: tests/**/*.py
      instructions: >-
        When reviewing test code under `tests/`:

        1. Three directories only: `tests/unit/`, `tests/property/`, `tests/integration/`. There is no
        `tests/fixtures/`, no `tests/benchmark/`, no `tests/public_api/`. Flag any new test directory not in
        this list.

        2. Test markers: the only markers declared in `pyproject.toml`'s `[tool.pytest.ini_options].markers` are
        `property` and `integration`. New markers must be added to `pyproject.toml` first or pytest's
        `--strict-markers` rejects them.

        3. Property tests: must use Hypothesis. The five property tests named in PROPOSED_STRUCTURE.md are the
        mechanical evidence for MANDATE.md §1.2's three invariants and Laws 2, 12, 13. They are:
        `test_replay_invariant`, `test_idempotence_invariant`, `test_uniqueness_invariant`,
        `test_artifact_immutability_invariant`, `test_canonicalization_invariant`. Flag any PR that drops or
        weakens any of these.

        4. Replay tests must verify byte-equality of the rehydrated artifact to the original
        (`assert rehydrated == artifact` AND `assert rehydrated.canonical_bytes() == art.canonical_bytes()`).
        Flag any replay test that checks only a subset of fields.

        5. No vendored test data. v2 has no `tests/fixtures/`, no PII, no third-party corpora. If a test
        needs data, it must be generated inline (Hypothesis strategies) or in a one-off local fixture inside
        the test file. Flag any test that reads from a path not under `tests/`.

        6. The Capability Protocol test must verify that two independent implementations of the same capability
        produce the same canonical value (mandate §5.1 litmus test). The EmailCapability test must verify
        every policy combination (default, gmail alias, strict, strict+unicode-reject) and verify
        idempotence.

        7. Do not delete or weaken a failing test to make the suite pass. A determinism violation is a hard
        test failure, not a flake.
    - path: src/paxman/_core/orchestrator.py
      instructions: >-
        When reviewing the orchestrator (the pipeline Paxman owns, mandate Law 6):

        1. The pipeline walks exactly six stages: `inspect → resolve → execute → canonicalize → validate → classify`.
        Users can register capabilities (the `execute` stage); they may NOT rearrange the other five. Flag any
        user-facing hook into a non-`execute` stage.

        2. The orchestrator catches `ContractError` and yields `Status.UNSUPPORTED` rather than raising. The
        catch must include an `Evidence` entry naming the unknown `kind`. Flag any re-raise of `ContractError`
        for a malformed contract that is in scope (the user can pass an unknown `kind`; that is an
        `UNSUPPORTED` outcome, not a runtime error).

        3. The orchestrator calls `registry.freeze()` implicitly on the first invocation. The freeze is
        idempotent. Flag any explicit freeze that races with an in-flight call.

        4. The multi-claimant case yields `Status.AMBIGUOUS` with an `Evidence` entry listing all claimants
        (mandate §5.4, Law 4). Flag any code path that picks a single capability from a multi-claimant set.

        5. The orchestrator is a pure function of `(input, contract, frozen_registry, paxman_version)`. Flag
        any read of `time`, `os.urandom`, `uuid.uuid4`, or any other non-deterministic source inside
        `canonicalize`.
    - path: src/paxman/_core/artifact.py
      instructions: >-
        When reviewing `ExecutionArtifact`:

        1. The class is `@attrs.frozen`. Every field is set at construction. `replay_hash` is computed in
        `__attrs_post_init__` via `object.__setattr__` (the one permitted mutation). Flag any code path that
        bypasses `__setattr__` enforcement.

        2. `canonical_bytes()` produces a deterministic JSON serialization: `sort_keys=True`, no whitespace,
        `ensure_ascii=False`, UTF-8 encoded. The `replay_hash` is `sha256(canonical_bytes())`. Flag any
        change to the serialization that breaks byte-equality across runs.

        3. The artifact must not embed secrets, raw input, or any external state. Flag any field that carries
        a URL, an environment variable name, or a raw input payload.

        4. The contract is stored on the artifact in addition to the parsed view, so `replay(artifact,
        contract)` does not need the caller's original contract dict. The stored form must round-trip
        through `parse_contract`.
    - path: src/paxman/_core/replay.py
      instructions: >-
        When reviewing the replay path (mandate Law 12):

        1. `replay(artifact, contract)` verifies, in order: (a) `paxman_version` matches, (b) `contract_version`
        matches, (c) `capabilities_hash` matches the current frozen registry, (d) `replay_hash` matches
        `sha256(artifact.canonical_bytes())`. Each mismatch raises a specific exception
        (`VersionMismatchError` for (a)–(c), `CanonicalizationError` for (d)). Flag any "verification" that
        re-reads the stored value rather than recomputing it.

        2. The function returns the artifact, byte-equal, or raises. There is no `Status` on the replay path.
        Flag any code path that returns a `Status`-bearing artifact instead of raising.

        3. Replay must not re-execute any capability. The orchestrator, the registry, the contract parser, and
        the validators are all in scope; capabilities and their canonicalize methods are NOT. Flag any
        `capability.canonicalize(...)` call inside `replay`.
    - path: src/paxman/_capabilities/**
      instructions: >-
        When reviewing the Capability SPI and any built-in capability:

        1. The `Capability` Protocol has exactly two methods: `can_handle(contract, value) -> bool` and
        `canonicalize(value, contract) -> CapabilityResult`. The Protocol deliberately omits control-flow
        verbs: no `next`, `execute`, `pipeline`, `stage`, `context switching`, `branching`. Flag any
        addition to the Protocol that introduces orchestration.

        2. A capability is a pure function of `(value, contract)` (mandate Law 8a). No `import requests`,
        no `open(`, no `os.`, no `time.`, no `random.`, no `secrets.`, no `datetime.`, no environment reads,
        no filesystem. Flag any of these in any file under `src/paxman/_capabilities/`.

        3. Two independent implementations of the same capability, given the same `(value, contract)` and the
        same MANDATE.md anchors, MUST produce the same canonical value (mandate §5.1 litmus test). Flag any
        capability that depends on a global, a module-level cache, or a hidden state.

        4. The CapabilityRegistry exposes `register(capability)`, `resolve(contract, value)`, `resolve_all(...)`,
        `freeze()`, and `capabilities_hash()`. After `freeze()`, `register` raises `FrozenRegistryError`. A
        duplicate name at `register` time raises `ConfigurationError`. Flag any registry method that ranks
        capabilities, scores them, or picks a "best" one (mandate Law 3 — never guess).

        5. Built-in capabilities live under `src/paxman/_capabilities/builtins/`. The `__init__.py` is empty
        by design (v2 ships one capability; the directory exists for import-path stability). Flag any
        placeholder capability that is not yet implemented.
    - path: src/paxman/_contracts/contract.py
      instructions: >-
        When reviewing the contract layer:

        1. v1.0.0 has exactly one contract kind: `canonical_email`. The Dict DSL's `kind` field is a closed
        enum. Adding a new `kind` requires a design spec under `docs/superpowers/specs/` and an implementation
        plan under `docs/superpowers/plans/`. Flag any new `kind` without those documents.

        2. Contract fields are policy declarations (mandate Law 5 — "what, not how"). The current fields are
        `lowercase`, `strip_whitespace`, `provider_aliases`, `strict`. Flag any field that describes an
        algorithm (`auto_detect`, `infer_provider`, `use_llm`).

        3. `parse_contract` raises `ContractError` on malformed input. The orchestrator catches
        `ContractError` and yields `Status.UNSUPPORTED`. Flag any `parse_contract` call site that does not
        catch.

        4. The contract carries a `version` field. Replay verifies the contract version matches between the
        artifact and the current contract. Bumping the version is a breaking change to the contract
        vocabulary.
    - path: src/paxman/__init__.py
      instructions: >-
        When reviewing the public API:

        1. The v2 public surface is exactly: `paxman.canonicalize`, `paxman.replay`, `paxman.register_capability`,
        plus the value-type re-exports (`ExecutionArtifact`, `Status`, `Evidence`, `VersionStamp`,
        `CapabilityResult`, `ValidationResult`, `Contract`, `CanonicalEmailContract`, `parse_contract`,
        `Capability`, `CapabilityRegistry`) and the error types. The v1.x submodule `paxman.api` is GONE; the
        v1.x submodule `paxman.testing` is GONE. Flag any import from `paxman.api` or `paxman.testing`.

        2. New public symbols require a design spec under `docs/superpowers/specs/` and an implementation
        plan under `docs/superpowers/plans/`. Flag any new export in `__all__` that lacks both.

        3. `register_capability` is a thin wrapper over the default registry in `paxman._orchestrator_runtime`.
        It must NOT auto-register any capability on `import paxman` — the user opts in by importing the
        built-in module. Flag any module-level side effect in `_capabilities/builtins/` that auto-registers
        on import.
    - path: pyproject.toml
      instructions: >-
        When reviewing pyproject.toml:

        1. The runtime dependency set is empty (`[project].dependencies = []`). The v1.x 4-package core cap
        is GONE; v2 has no runtime dependencies beyond the standard library and `attrs` (which is in the
        `dev` group only, not runtime). Flag any addition to `[project].dependencies`.

        2. v1.0.0 has no `ruff`, `mypy`, `pyright`, `import-linter`, or `coverage` configuration in
        `pyproject.toml`. The only `[tool.pytest.ini_options]` section is the one that registers the
        `property` and `integration` markers. Adding these tools requires a design spec (each is a
        constitutional-level decision because it can either uphold or violate Law 1 / Law 11 depending on
        configuration).

        3. The `hatchling` build backend and the `[tool.hatch.build.targets.wheel]` section pointing at
        `src/paxman` are the v1.0.0 build settings. Do not change them.

        4. There is no Makefile, no CI workflow, no pre-commit config in v1.0.0. Adding any of these is a
        v1.0.x decision and requires a design spec.

        5. The package version is `0.0.0.dev0` until the first release; do not bump it without a release
        process being defined.
    - path: docs/superpowers/specs/**/*.md
      instructions: >-
        When reviewing design specifications under `docs/superpowers/specs/`:

        1. Specs are the v2 design artefacts. They are anchored to MANDATE.md: every design decision in a
        spec must trace to a section or law in MANDATE.md, or be marked as a candidate for drift. Flag any
        spec section that introduces a concept not in MANDATE.md without marking it as drift.

        2. The user has directed that there be at most ONE design spec and ONE implementation plan per
        capability in v1.0.0. Multiple specs for the same capability are not allowed.

        3. Specs must be precise enough to be implemented against. Flag hand-wavy language (`"etc."`,
        `"and so on"`, `"TBD"`) in normative sections.

        4. Specs may evolve freely (unlike MANDATE.md, which is amendable, not appendable). Version-bump
        the spec title or add a "Changelog" section when behavior changes.
    - path: docs/superpowers/plans/**/*.md
      instructions: >-
        When reviewing implementation plans under `docs/superpowers/plans/`:

        1. Plans are TDD-first: each task is "write failing test, run it RED, implement, run GREEN, commit".
        Flag any plan that does not have this structure.

        2. There must be at most ONE implementation plan per design spec in v1.0.0. Flag any second plan
        for the same spec.

        3. Plans must reference their design spec by path. Flag any plan that does not.

        4. Plans must include an end-to-end manual verification step (a `uv run python -c '...'` block) that
        the implementer runs after all tasks complete. Flag any plan that omits this.
    - path: RETRACTION.md
      instructions: >-
        When reviewing RETRACTION.md:

        1. RETRACTION.md is a permanent historical record. Do not edit it to reflect v2 changes — it
        documents the v1.x failure. New v2 history belongs in a new document (or in the commit log).

        2. RETRACTION.md is allowed to quote v1.x API names verbatim from the audit (e.g.
        `paxman.normalize(...)`) as part of the failure record. Do not flag those quotes as v1.x API
        contamination — they are intentional historical evidence.
    - path: "**/*.md"
      instructions: >-
        General Markdown rules for the project:

        1. The project uses GitHub-flavored Markdown.

        2. Wrap inline code with single backticks; use fenced blocks (```python, ```bash, ```yaml) for
        multi-line snippets. Specify a language on every fenced block.

        3. Internal links must be relative paths that exist in the repo. Flag absolute `file://` links and
        links to deleted files. Files that exist in v1.x but not v2 (e.g. `docs/adr/0001-...`, `examples/`,
        `playground/`, `Makefile`, `mkdocs.yml`) must not be linked.

        4. Headings must be in title case with a blank line before and after.

        5. The vocabulary in MANDATE.md §6.3 is normative. Flag any use of `heuristic`, `confidence`,
        `best match`, `probably`, or `approximate` in any markdown file under the project — including in
        examples, rationale sections, and "alternatives considered" callouts. The adopted vocabulary
        (`resolver`, `dispatcher`, `registry`, `matcher`, `capability resolution`) is preferred.
  auto_review:
    ignore_title_keywords:
      - WIP
      - wip
      - "[skip review]"
      - "[norabbit]"
      - DO NOT REVIEW
    base_branches:
      - main
      - HOTFIX-*
      - sprint-*
      - v*.*.*
      - release/*
      - feat/*
  finishing_touches:
    unit_tests:
      enabled: false
    simplify:
      enabled: true

knowledge_base:
  jira:
    usage: disabled
  linear:
    usage: disabled
  mcp:
    usage: enabled

issue_enrichment:
  auto_enrich:
    enabled: true
