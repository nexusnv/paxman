# Dependabot configuration for Paxman
# See https://docs.github.com/en/code-security/dependabot/dependabot-version-updates

version: 2

updates:
  # Python dependencies (uv-managed via pyproject.toml)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Kuala_Lumpur"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "needs-triage"
    assignees:
      - "nexusnv"
    groups:
      # Group non-breaking updates together for low-risk review.
      non-breaking:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
      # The single production runtime dependency gets its own group so a
      # bump to attrs is reviewed separately from dev/test tool bumps.
      production:
        applies-to: version-updates
        patterns:
          - "attrs"

  # GitHub Actions (workflow dependencies)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 3
    labels:
      - "ci"
      - "dependencies"
    assignees:
      - "nexusnv"
