name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions; jobs opt-in to more as needed.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests (the core gate; required)
  # Multi-version: the pyproject.toml classifiers list py3.11, 3.12, 3.13.
  # ---------------------------------------------------------------------------
  test-unit:
    name: unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen --all-extras --dev --python ${{ matrix.python-version }}

      - name: Run unit tests
        run: uv run --python ${{ matrix.python-version }} pytest tests/unit --no-header

  # ---------------------------------------------------------------------------
  # Lint (ruff) and format check
  # The user asked to add lint and typecheck so that CodeRabbit's quota
  # is spent on design-level comments, not on code errors that lint and
  # typecheck can catch first. Ruff is in the dev dependency group; the
  # config lives in [tool.ruff] in pyproject.toml.
  # py3.12 only: ruff is a static tool, not affected by Python version.
  # ---------------------------------------------------------------------------
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen --all-extras --dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format --check)
        run: uv run ruff format --check .

  # ---------------------------------------------------------------------------
  # Type check (mypy)
  # Moderate config in [tool.mypy] in pyproject.toml. Not full --strict:
  # the orchestrator's lazy circular-import workaround and the
  # `_ContractLike` Protocol structural typing would require additional
  # stubs that are not yet worth the complexity for v1.0.0.
  # py3.12 only: mypy is a static tool, not affected by Python version.
  # ---------------------------------------------------------------------------
  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen --all-extras --dev

      - name: Type check (mypy src/paxman)
        run: uv run mypy src/paxman

  # ---------------------------------------------------------------------------
  # Property tests (Hypothesis; mandate §1.2 three invariants)
  # py3.12 only: the property tests are the mechanical evidence for the
  # three invariants (replay byte-equality, idempotence, uniqueness).
  # Running on one version is sufficient; the unit-test matrix covers
  # multi-version compatibility.
  # ---------------------------------------------------------------------------
  test-property:
    name: property tests (py3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen --all-extras --dev

      - name: Run property tests
        # Property tests are the mechanical evidence for the three
        # invariants in MANDATE.md §1.2. They use Hypothesis with
        # derandomize=True for determinism (mandate Law 1).
        run: uv run pytest -m property --no-header

  # ---------------------------------------------------------------------------
  # Integration tests (end-to-end public-API exercise)
  # py3.12 only: the integration test exercises the public API surface
  # (paxman.canonicalize, paxman.replay, paxman.register_capability).
  # ---------------------------------------------------------------------------
  test-integration:
    name: integration tests (py3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen --all-extras --dev

      - name: Run integration tests
        run: uv run pytest tests/integration --no-header
