name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel in-progress runs for the same PR when a new commit is pushed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimal permissions; jobs opt-in to more as needed.
permissions:
  contents: read

jobs:
  # ---------------------------------------------------------------------------
  # Unit tests (the core gate; required)
  # Multi-version: the pyproject.toml classifiers list py3.11, 3.12, 3.13.
  # ---------------------------------------------------------------------------
  test-unit:
    name: unit tests (py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen --all-extras --dev --python ${{ matrix.python-version }}

      - name: Run unit tests
        run: uv run --python ${{ matrix.python-version }} pytest tests/unit --no-header

  # ---------------------------------------------------------------------------
  # Lint (ruff) and format check
  # The user asked to add lint and typecheck so that CodeRabbit's quota
  # is spent on design-level comments, not on code errors that lint and
  # typecheck can catch first. Ruff is in the dev dependency group; the
  # config lives in [tool.ruff] in pyproject.toml.
  # py3.12 only: ruff is a static tool, not affected by Python version.
  # ---------------------------------------------------------------------------
  lint:
    name: lint (ruff)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen --all-extras --dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format --check)
        run: uv run ruff format --check .

      - name: Static analysis (README↔quickstart parity, capability section, paxman.normalize substring, retired vocabulary)
        run: |
          uv run python scripts/check_readme_quickstart.py
          uv run python scripts/check_capability_section_isolation.py
          uv run python scripts/check_paxman_normalize_substring.py
          uv run python scripts/check_retired_vocabulary.py

  # ---------------------------------------------------------------------------
  # Type check (mypy)
  # Moderate config in [tool.mypy] in pyproject.toml. Not full --strict:
  # the orchestrator's lazy circular-import workaround and the
  # `_ContractLike` Protocol structural typing would require additional
  # stubs that are not yet worth the complexity for v2.0.0.
  # py3.12 only: mypy is a static tool, not affected by Python version.
  # ---------------------------------------------------------------------------
  typecheck:
    name: typecheck (mypy)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen --all-extras --dev

      - name: Type check (mypy src/paxman)
        run: uv run mypy src/paxman

  # ---------------------------------------------------------------------------
  # Property tests (Hypothesis; MANDATE §1.2 three invariants)
  # py3.12 only: the property tests are the mechanical evidence for the
  # three invariants (Replay, Idempotence, Uniqueness). Running on one
  # version is sufficient; the unit-test matrix covers multi-version
  # compatibility.
  # ---------------------------------------------------------------------------
  test-property:
    name: property tests (py3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen --all-extras --dev

      - name: Run property tests
        # Property tests are the mechanical evidence for the three
        # invariants in MANDATE.md §1.2 (Identity, Determinism, Replay).
        # They use Hypothesis with derandomize=True for determinism
        # (mandate Law 1).
        run: uv run pytest -m property --no-header

  # ---------------------------------------------------------------------------
  # Integration tests (end-to-end public-API exercise)
  # py3.12 only: the integration test exercises the public API surface
  # (paxman.canonicalize, paxman.replay, paxman.register_capability).
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # Coverage gate (per-subpackage, ≥90% each)
  # Every top-level first-party package under src/paxman must independently
  # maintain at least 90% line coverage. After the v2 architecture refactor
  # (domain-free core + per-capability packages), the first-party packages are
  # _capabilities, _core, _dsl, _registry, _types, _errors. The former
  # _contracts package was dissolved: contracts now live in
  # _capabilities/<domain>/contract.py and _core/contracts.py, both covered by
  # their respective package globs.
  # We run the unit suite once to produce a single .coverage data file, then
  # assert each package's coverage with `coverage report --fail-under=90
  # --include=...`. A package below 90% makes that report step exit non-zero
  # and fails the job.
  # A global threshold is deliberately NOT used: it would let a
  # well-covered package subsidize a poorly-covered one.
  # ---------------------------------------------------------------------------
  coverage:
    name: coverage + per-subsystem threshold
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen --all-extras --dev

      - name: Run unit tests with coverage
        run: uv run pytest tests/unit --cov=paxman --cov-report= --no-header

      - name: Coverage gate — per-subpackage ≥90%
        run: |
          set +e
          failed=0
          for pkg in _capabilities _core _dsl _registry _types _errors; do
            uv run coverage report --fail-under=90 --include="*/paxman/$pkg/*"
            if [ $? -ne 0 ]; then
              echo "::error::Subpackage $pkg is below the 90% coverage gate."
              failed=1
            fi
          done
          if [ "$failed" -ne 0 ]; then
            echo "::error::One or more subpackages are below the 90% coverage gate."
            exit 1
          fi

  # ---------------------------------------------------------------------------
  # Combined static gate: lint + format + typecheck + import parity.
  # Matches the branch-protection required check
  # "lint + format + typecheck + import". The four repo-parity scripts
  # verify imports resolve, README↔quickstart parity, capability-section
  # isolation, the paxman.normalize substring ban, and retired vocabulary.
  # py3.12 only: these are static tools, not affected by Python version.
  # ---------------------------------------------------------------------------
  lint-format-typecheck-import:
    name: lint + format + typecheck + import
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen --all-extras --dev

      - name: Lint (ruff check)
        run: uv run ruff check .

      - name: Format check (ruff format --check)
        run: uv run ruff format --check .

      - name: Type check (mypy src/paxman)
        run: uv run mypy src/paxman

      - name: Static analysis (import / README↔quickstart parity / capability section / paxman.normalize substring / retired vocabulary)
        run: |
          uv run python scripts/check_readme_quickstart.py
          uv run python scripts/check_capability_section_isolation.py
          uv run python scripts/check_paxman_normalize_substring.py
          uv run python scripts/check_retired_vocabulary.py

  # ---------------------------------------------------------------------------
  # Docstring coverage on the public API surface (src/paxman/__init__.py).
  # Matches the branch-protection required check
  # "interrogate - 100% docstring coverage on public surface".
  # Scoped to the public surface only (see design spec); internal helpers are
  # intentionally out of scope. py3.12 only.
  # ---------------------------------------------------------------------------
  interrogate:
    name: interrogate - 100% docstring coverage on public surface
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen --all-extras --dev

      - name: Docstring coverage (public surface)
        run: uv run interrogate -c pyproject.toml src/paxman/__init__.py

  test-integration:
    name: integration tests (py3.12)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (frozen lockfile)
        run: uv sync --frozen --all-extras --dev

      - name: Run integration tests
        run: uv run pytest tests/integration --no-header

  # ---------------------------------------------------------------------------
  # Playground notebook smoke test
  # Executes every notebook in playground/notebooks/ top-to-bottom with
  # `jupyter nbconvert --execute` so API drift in the public surface (or a
  # broken example) fails CI instead of rotting. The job globs the directory,
  # so newly added capability notebooks are picked up automatically. py3.12
  # only: notebooks exercise the public API, not a version-specific path.
  # ---------------------------------------------------------------------------
  notebook-smoke:
    name: playground notebook smoke test (py3.12)
    runs-on: ubuntu-latest
    # Bound the job and each notebook so a hanging/looping cell cannot burn the
    # full 6h runner budget.
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@11f9893b081a58869d3b5fccaea48c9e9e46f990 # v8.3.2
        with:
          enable-cache: true
          cache-dependency-glob: |
            uv.lock
            pyproject.toml

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies (frozen lockfile)
        # jupyter + nbconvert live in the `playground` [dependency-groups]
        # group; `--all-groups` installs every dependency-group (dev +
        # playground), which is what this job needs to execute the notebooks.
        run: uv sync --frozen --all-groups

      - name: Check notebooks are in sync with the generator
        # Drift guard: the committed notebooks must match what
        # scripts/gen_playground_notebooks.py produces. Regenerates to a temp
        # dir and diffs; never modifies the tree. Catches hand-edits that drift
        # from the generator's source of truth.
        run: uv run python scripts/gen_playground_notebooks.py --check

      - name: Execute playground notebooks
        run: |
          shopt -s nullglob
          fails=0
          for nb in playground/notebooks/*.ipynb; do
            echo "::group::execute $nb"
            log="$(mktemp)"
            # --ExecutePreprocessor.timeout bounds a single notebook; stderr is
            # captured and surfaced on failure (not discarded) for diagnostics.
            if uv run jupyter nbconvert --ExecutePreprocessor.timeout=120 --execute --to notebook --stdout "$nb" >/dev/null 2>"$log"; then
              echo "ok: $nb"
            else
              echo "::error::notebook failed to execute: $nb"
              sed 's/^/    /' "$log"
              fails=1
            fi
            rm -f "$log"
            echo "::endgroup::"
          done
          exit "$fails"
