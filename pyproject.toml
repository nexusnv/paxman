[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paxman"
version = "0.0.0.dev0"
description = "Deterministic canonicalization engine for Python."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Paxman core team" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# Runtime: attrs is the only third-party runtime dep. It is the
# `frozen=True` dataclass backbone for every value type under
# `src/paxman/` (mandate Laws 1, 12, 13). v2.0.0 ships no other
# runtime dependencies.
dependencies = [
    "attrs>=26.1.0",
]

[project.urls]
Homepage = "https://github.com/nexusnv/paxman"
Issues = "https://github.com/nexusnv/paxman/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/paxman"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "hypothesis>=6.156.6",
    "ruff>=0.16.0",
    "mypy>=2.3.0",
    "interrogate>=1.7.0",
    "nbformat>=5.10.4",
    "import-linter>=2.13",
    "pydeps>=3.0.7",
]
# Optional: only needed for the playground notebook smoke test / local lab.
# Kept out of the base `dev` group so a normal `uv sync` does not pull the
# heavy Jupyter stack. CI installs it via `--all-extras`.
playground = [
    # Notebook smoke tests (playground/): execute .ipynb top-to-bottom in CI.
    "jupyter>=1.1.1",
    "nbconvert>=7.17.1",
]

# ---------------------------------------------------------------------------
# Coverage (pytest-cov / coverage.py)
# The CI enforces a per-subpackage ≥90% line-coverage gate (see
# .github/workflows/ci.yml, "coverage" job). We measure only first-party
# source under `paxman`; tests and generated files are excluded. The
# per-package thresholds are asserted in CI via `coverage report
# --fail-under=90 --include=...`, so no global `fail_under` is set here
# (a global threshold would let a well-covered package subsidize a
# poorly-covered one, which the per-subpackage gate is meant to prevent).
# ---------------------------------------------------------------------------
[tool.coverage.run]
source = ["paxman"]
omit = [
    "*/tests/*",
    "*/tests/**/*",
]

[tool.coverage.report]
show_missing = true
skip_covered = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "property: hypothesis-driven property tests",
    "integration: end-to-end integration tests",
]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# Conservative rule set for v2.0.0. Catches real issues (unused imports,
# pycodestyle errors/warnings, bugbear, isort, pyupgrade) without the
# stricter ANN (annotations) or S (security) families that would
# flag a large volume of test/legacy code in the v2 codebase. Tests
# get S101 (assert) and B011 (assertRaises) ignored — standard practice
# for pytest test code.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
# Notebooks are pedagogical examples verified by the `notebook-smoke` CI job
# (jupyter nbconvert --execute), not by the source linter. Exclude them so
# ruff does not flag example-only imports/ordering inside notebook cells.
# Use extend-exclude to preserve Ruff's built-in default excludes
# (.git, *.pyc, venvs, etc.) rather than replacing them.
extend-exclude = ["playground", "*.md"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (common bugs)
    "UP",  # pyupgrade (modern Python syntax)
    "RUF", # ruff-specific rules
]
# RUF009 (function call in attrs field default) is intentionally ignored: the
# shared `authority_override_field()` factory (paxman._capabilities._shared.contract)
# is the mandated cross-domain pattern for the authority-override escape hatch.
# `# noqa` is banned in src/paxman/, so ignoring the rule project-wide is the
# only compliant way to permit the shared field across all 10 capability contracts.
ignore = ["RUF009"]
# ANN (annotations) is intentionally excluded: v2 uses `object` and
# `Any` in a few narrow places where the type is genuinely dynamic
# (the orchestrator's lazy imports, the artifact's Protocol contract).
# The mandate forbids `# type: ignore` for type-error suppression, so
# we don't enable ANN.
# S (security) is excluded: S101 (assert) and S105/S106 (hardcoded
# strings) are not appropriate for v2's test/dev code. S101 is
# specifically ignored in tests via per-file-ignores below.

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # `assert` is the standard pytest pattern
    "B011",  # `assertRaises(Exception)` is fine in tests
]

# ---------------------------------------------------------------------------
# Mypy (type check)
# Moderate type-safety: ``disallow_untyped_defs`` is on, but several error
# codes are intentionally allowed (see AGENTS.md). The ``_ContractLike``
# Protocol uses structural typing (a Protocol with ``...`` method bodies)
# which mypy handles natively; ``_StubContract`` satisfies it structurally.
# The concrete ``Canonical*Contract`` types declare
# ``authority_override: Any | None`` via the shared
# ``authority_override_field()`` factory.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src/paxman"]
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true

# ---------------------------------------------------------------------------
# interrogate — docstring coverage on the public API surface.
# The project mandates a docstring on every public symbol in src/paxman
# (see AGENTS.md / CODING_GUIDELINES.md). CI runs interrogate against
# src/paxman/__init__.py (the public surface: canonicalize, replay,
# register_capability, and the __all__ re-exports) and fails below 100%.
# Scoped to __init__.py on the CLI so internal helpers are not in scope.
# ---------------------------------------------------------------------------
[tool.interrogate]
fail-under = 100
verbose = 1
ignore-init-module = true

# ---------------------------------------------------------------------------
# Import-linter — architectural import boundary enforcement.
# Uses grimp (bundled) to build an import graph and check contracts.
# Catches violations like domain packages importing core, or domains
# importing sibling domains.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "paxman"

[[tool.importlinter.contracts]]
id = "pipeline-no-concrete-capabilities"
name = "Pipeline must not import concrete domain canonicalizers"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "paxman._core.engine",
    "paxman._core.replay",
]
forbidden_modules = [
    "paxman._capabilities.*.canonicalizer",
]

[[tool.importlinter.contracts]]
id = "capabilities-no-sibling-domains"
name = "Capability domain packages must not import sibling domains"
type = "forbidden"
allow_indirect_imports = true
source_modules = [
    "paxman._capabilities.boolean",
    "paxman._capabilities.country",
    "paxman._capabilities.date",
    "paxman._capabilities.email",
    "paxman._capabilities.geolocation",
    "paxman._capabilities.ip",
    "paxman._capabilities.money",
    "paxman._capabilities.phone",
    "paxman._capabilities.url",
    "paxman._capabilities.uuid",
]
forbidden_modules = [
    "paxman._capabilities.boolean",
    "paxman._capabilities.country",
    "paxman._capabilities.date",
    "paxman._capabilities.email",
    "paxman._capabilities.geolocation",
    "paxman._capabilities.ip",
    "paxman._capabilities.money",
    "paxman._capabilities.phone",
    "paxman._capabilities.url",
    "paxman._capabilities.uuid",
]

[[tool.importlinter.contracts]]
id = "capabilities-no-dsl"
name = "Capability domain packages must not import _dsl"
type = "forbidden"
allow_indirect_imports = false
source_modules = [
    "paxman._capabilities.boolean",
    "paxman._capabilities.country",
    "paxman._capabilities.date",
    "paxman._capabilities.email",
    "paxman._capabilities.geolocation",
    "paxman._capabilities.ip",
    "paxman._capabilities.money",
    "paxman._capabilities.phone",
    "paxman._capabilities.url",
    "paxman._capabilities.uuid",
]
forbidden_modules = [
    "paxman._dsl",
]


[[tool.importlinter.contracts]]
id = "errors-is-leaf"
name = "_errors must be a leaf module (no internal imports)"
type = "forbidden"
source_modules = [
    "paxman._errors",
]
forbidden_modules = [
    "paxman",
    "paxman._capabilities",
    "paxman._core",
    "paxman._dsl",
    "paxman._registry",
    "paxman._types",
    "paxman._provenance",
]

[[tool.importlinter.contracts]]
id = "types-is-leaf"
name = "_types must be a leaf module (no internal imports)"
type = "forbidden"
source_modules = [
    "paxman._types",
]
forbidden_modules = [
    "paxman",
    "paxman._capabilities",
    "paxman._core",
    "paxman._dsl",
    "paxman._registry",
    "paxman._errors",
    "paxman._provenance",
]

# ---------------------------------------------------------------------------
# pydeps — dependency visualization.
# Generates SVG dependency graphs for architecture review.
# Usage: uv run pydeps src/paxman --max-bacon=2
# ---------------------------------------------------------------------------
[tool.pydeps]
# Show only direct dependencies (max depth 2)
max_bacon = 2
# Disable clustering of external packages in the graph
cluster = false

