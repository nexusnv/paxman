[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paxman"
version = "0.0.0.dev0"
description = "Deterministic canonicalization engine for Python."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Paxman core team" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# Runtime: attrs is the only third-party runtime dep. It is the
# `frozen=True` dataclass backbone for every value type under
# `src/paxman/` (mandate Laws 1, 12, 13). v1.0.0 ships no other
# runtime dependencies.
dependencies = [
    "attrs>=23.0",
]

[project.urls]
Homepage = "https://github.com/nexusnv/paxman"
Issues = "https://github.com/nexusnv/paxman/issues"
Retraction = "https://github.com/nexusnv/paxman/blob/main/RETRACTION.md"

[tool.hatch.build.targets.wheel]
packages = ["src/paxman"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "property: hypothesis-driven property tests",
    "integration: end-to-end integration tests",
]
