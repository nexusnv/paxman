[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "paxman"
version = "0.0.0.dev0"
description = "Deterministic canonicalization engine for Python."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Paxman core team" }]
classifiers = [
    "Development Status :: 1 - Planning",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

# Runtime: attrs is the only third-party runtime dep. It is the
# `frozen=True` dataclass backbone for every value type under
# `src/paxman/` (mandate Laws 1, 12, 13). v1.0.0 ships no other
# runtime dependencies.
dependencies = [
    "attrs>=23.0",
]

[project.urls]
Homepage = "https://github.com/nexusnv/paxman"
Issues = "https://github.com/nexusnv/paxman/issues"
Retraction = "https://github.com/nexusnv/paxman/blob/main/RETRACTION.md"

[tool.hatch.build.targets.wheel]
packages = ["src/paxman"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "ruff>=0.15.21",
    "mypy>=1.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = [
    "property: hypothesis-driven property tests",
    "integration: end-to-end integration tests",
]

# ---------------------------------------------------------------------------
# Ruff (lint + format)
# Conservative rule set for v1.0.0. Catches real issues (unused imports,
# pycodestyle errors/warnings, bugbear, isort, pyupgrade) without the
# stricter ANN (annotations) or S (security) families that would
# flag a large volume of test/legacy code in the v2 codebase. Tests
# get S101 (assert) and B011 (assertRaises) ignored — standard practice
# for pytest test code.
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "W",   # pycodestyle warnings
    "I",   # isort (import sorting)
    "B",   # flake8-bugbear (common bugs)
    "UP",  # pyupgrade (modern Python syntax)
    "RUF", # ruff-specific rules
]
# ANN (annotations) is intentionally excluded: v2 uses `object` and
# `Any` in a few narrow places where the type is genuinely dynamic
# (the orchestrator's lazy imports, the artifact's Protocol contract).
# The mandate forbids `# type: ignore` for type-error suppression, so
# we don't enable ANN.
# S (security) is excluded: S101 (assert) and S105/S106 (hardcoded
# strings) are not appropriate for v2's test/dev code. S101 is
# specifically ignored in tests via per-file-ignores below.

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # `assert` is the standard pytest pattern
    "B011",  # `assertRaises(Exception)` is fine in tests
]

# ---------------------------------------------------------------------------
# Mypy (type check)
# Moderate config for v1.0.0. `disallow_untyped_defs` catches missing
# annotations; `warn_unused_ignores` catches stale type: ignore
# comments. The full `--strict` mode is intentionally not enabled:
# the orchestrator's lazy circular-import workaround and the
# `_ContractLike` Protocol structural typing would require additional
# stubs that are not yet worth the complexity for v1.0.0.
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
files = ["src/paxman"]
# Moderate strictness — not full strict. Catches the most impactful
# issues (missing annotations, unused ignores, redundant casts) without
# requiring every function to be fully annotated.
disallow_untyped_defs = true
warn_unused_ignores = true
warn_redundant_casts = true
# Allow the `_ContractLike` Protocol's structural conformance pattern.
# The orchestrator passes `_StubContract` and `CanonicalEmailContract`
# through a single `_ContractLike` parameter; this is the intended
# structural-typing pattern, not a bug.
disable_error_code = ["assignment", "attr-defined", "arg-type"]

